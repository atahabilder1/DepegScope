# Historical depeg events for validation
historical_depegs:
  terra_ust:
    date: "2022-05-09"
    stablecoin: "UST"
    type: "algorithmic"
    low_price: 0.006
    total_loss_usd: 60000000000
    duration_days: 7
    cause: "Death spiral - algorithmic mechanism failure"
    affected_protocols:
      - "Anchor Protocol"
      - "Mirror Protocol"
      - "Lido (stLUNA)"
    cascade_effects:
      - "LUNA collapse"
      - "3AC insolvency"
      - "Celsius freeze"
      - "Voyager bankruptcy"

  usdc_svb:
    date: "2023-03-11"
    stablecoin: "USDC"
    type: "fiat-backed"
    low_price: 0.87
    recovery_days: 3
    cause: "SVB collapse, $3.3B reserves frozen"
    affected_stablecoins:
      - symbol: "DAI"
        low_price: 0.89
        reason: "60% USDC collateral"
      - symbol: "FRAX"
        low_price: 0.87
        reason: "USDC backing"
    affected_protocols:
      - "MakerDAO"
      - "Frax Finance"
      - "Curve 3pool"
    lessons:
      - "Fiat-backed stablecoins have banking counterparty risk"
      - "Collateral concentration creates contagion"

  susd_2025:
    date: "2025-04-15"
    stablecoin: "sUSD"
    type: "crypto-backed"
    low_price: 0.68
    cause: "SIP-420 collateral change, SNX price decline"
    duration_days: 14
    affected_protocols:
      - "Synthetix"
      - "Curve sUSD pool"

  nov_2025_cascade:
    date: "2025-11-06"
    stablecoins: ["xUSD", "deUSD", "USDX"]
    trigger: "xUSD"
    low_prices:
      xUSD: 0.23
      deUSD: 0.02
      USDX: 0.30
    cause: "Stream platform $93M asset loss"
    cascade_pattern: "xUSD -> deUSD -> USDX"
    total_affected_tvl: 150000000
    lessons:
      - "Small stablecoins can cascade to each other"
      - "Shared collateral creates hidden dependencies"

# Stablecoin type characteristics
type_characteristics:
  fiat-backed:
    description: "Backed 1:1 by fiat currency reserves"
    risk_factors:
      - "Banking counterparty risk"
      - "Regulatory risk"
      - "Audit transparency"
    examples: ["USDT", "USDC", "TUSD", "FDUSD"]
    typical_collateral_ratio: 1.0

  crypto-backed:
    description: "Over-collateralized by cryptocurrency"
    risk_factors:
      - "Collateral volatility"
      - "Liquidation cascade risk"
      - "Oracle manipulation"
    examples: ["DAI", "LUSD", "sUSD", "GHO"]
    typical_collateral_ratio: 1.5

  algorithmic:
    description: "Maintains peg through algorithmic mechanisms"
    risk_factors:
      - "Death spiral risk"
      - "Confidence-dependent"
      - "Complex mechanism failure"
    examples: ["USDe", "UST (defunct)"]
    typical_collateral_ratio: 1.0

  hybrid:
    description: "Combination of collateral and algorithmic mechanisms"
    risk_factors:
      - "Combined risks of both types"
      - "Mechanism complexity"
    examples: ["FRAX"]
    typical_collateral_ratio: 0.85
